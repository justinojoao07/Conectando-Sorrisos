            <nav aria-label="Navegação Principal">

                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="pagina-topo" aria-labelledby="titulo-cadastro">
            <div class="container">
                <h1 id="titulo-cadastro">Cadastro</h1>
                <p>
                    Cadastre seus dados para participar do processo de atendimento odontológico.
                </p>
            </div>
        </section>

        <section class="secao container" aria-label="Formulário de cadastro">
            <form class="form-cadastro" id="form-cadastro" action="#" method="post">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" autocomplete="name" required>
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input type="number" id="idade" name="idade" min="1" max="120" inputmode="numeric" required>
                </div>

                <div class="campo">
                    <label for="programa">Programa de interesse</label>
                    <select id="programa" name="programa" required>
                        <option value="">Escolha uma opção</option>
                        <option value="dentista-do-bem">Dentista do Bem</option>
                        <option value="apolonias-do-bem">Apolônias do Bem</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="vulnerabilidade">Vulnerabilidade social</label>
                    <select id="vulnerabilidade" name="vulnerabilidade" required>
                        <option value="">Escolha uma opção</option>
                        <option value="alta">Alta vulnerabilidade</option>
                        <option value="media">Média vulnerabilidade</option>
                        <option value="baixa">Baixa vulnerabilidade</option>
                    </select>
                </div>

                <div class="campo-check">
                    <input type="checkbox" id="primeiro-emprego" name="primeiro-emprego">
                    <label for="primeiro-emprego">
                        Estou próximo(a) ou à procura do primeiro emprego.
                    </label>
                </div>

                <div class="campo-check">
                    <input type="checkbox" id="consentimento" name="consentimento" required>
                    <label for="consentimento">
                        Autorizo o uso dos meus dados para o processo de atendimento. Se for menor de 18 anos,
                        confirmo que tenho autorização de um responsável.
                    </label>
                </div>

                <button type="submit" class="botao botao-enviar">Cadastrar candidato(a)</button>

                <p id="retorno-cadastro" class="retorno-contato" role="status"></p>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <p class="copyright">&copy; 2026 - Todos os direitos reservados - Conectando Sorrisos</p>
    </footer>

</body>
