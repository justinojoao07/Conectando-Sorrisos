<head>
    <meta charset="UTF-8">

    <title>Cadastro - Conectando Sorrisos</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
         <div class="container cabecalho-conteudo">
            <a class="marca" href="index.html" aria-label="Conectando Sorrisos - Página Inicial"
                >Conectando Sorrisos</a>
           
            <nav aria-label="Navegação Principal">
                <ul class="menu">
                    <a href="../index.html">Início</a>
                    <a href="paginas/integrantes.html">Quem Somos</a>
                    <a href="paginas/sobre.html">Sobre</a>
                    <a href="paginas/faq.html">FAQ</a>
                    <a href="paginas/contato.html">Contato</a>
                    <a href="paginas/cadastro.html">Cadastro</a>
                    <a href="paginas/doacao.html">Doação</a>
                    <a href="paginas/fila.html">Fila de Espera</a>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <p>Cadastre seus dados para participar do processo
             de atendimento odontológico.</p>

        <h1>Cadastro</h1>

        <form>
            
            <label>Nome completo:</label>
            <input type="text">

            <br><br>

            <label>Idade:</label>
            <input type="number">

            <br><br>

            <label>Programa de interesse:</label>

            <select>
                <option>Escolha uma opção</option>
                <option>Dentista do Bem</option>
                <option>Apolonônias do Bem</option>
            </select>

            <br><br>

            <label>Vulnerabilidade social:</label>

            <select>
                <option>Escolha uma opção</option>
                <option>Alta vulnerabilidade</option>
                <option>Média vulnerabilidade</option>
                <option>Baixa vulnerabilidade</option>
            </select>

            <br><br>

            <label>
                <input type="checkbox">
                Estou próximo(a) ou estou a procura do primeiro emprego.
            </label>

            <br><br>

            <button type="submit">
                Cadastrar candidato(a)
            </button>

        </form>
    
    </main>

    <footer>

    </footer>

</body>
