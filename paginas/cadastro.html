<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Conectando Sorrisos</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        
        <h1>Conectando Sorrisos</h1>

        <nav>
            <a href="../index.html">Início</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="fila.html">Fila de prioridade</a>
            <a href="doacao.html">Doação</a>
        </nav>

    </header>

    <main>

        <p>Cadastre seus dados para participar do processo
             de atendimento odontológico.</p>

        <h1>Cadastro</h1>

        <form>
            
            <label>Nome completo:</label>
            <input type="text">

            <br><br>

            <label>Idade:</label>
            <input type="number">

            <br><br>

            <label>Programa de interesse:</label>

            <select>
                <option>Escolha uma opção</option>
                <option>Dentista do Bem</option>
                <option>Apolonônias do Bem</option>
            </select>

            <br><br>

            <label>Vulnerabilidade social:</label>

            <select>
                <option>Escolha uma opção</option>
                <option>Alta vulnerabilidade</option>
                <option>Média vulnerabilidade</option>
                <option>Baixa vulnerabilidade</option>
            </select>

            <br><br>

            <label>
                <input type="checkbox">
                Estou próximo(a) ou estou a procura do primeiro emprego.
            </label>

            <br><br>

            <button type="submit">
                Cadastrar candidato(a)
            </button>

        </form>
    
    </main>

    <footer>
        <p>&copy; 2026 - Todos os direitos reservados - Conectando Sorrisos</p>

    </footer>

</body>

</html>
